<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Crypto Edge Terminal V1</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e8edf7;font-family:Arial,sans-serif}
header{padding:12px 14px;border-bottom:1px solid #202a42;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0 14px 0 0}.controls{display:flex;gap:7px;flex-wrap:wrap}
select,button{background:#131b31;color:#e8edf7;border:1px solid #2b3857;border-radius:7px;padding:8px 10px}
button{cursor:pointer}.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px;padding:10px}
.panel{background:#10172a;border:1px solid #202a42;border-radius:10px;overflow:hidden}
#chart{height:620px;width:100%}.side{padding:12px}.title{font-weight:bold;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{background:#0b1020;border:1px solid #202a42;border-radius:8px;padding:9px}.lab{font-size:11px;color:#8d9ab5}.val{margin-top:3px;font-weight:bold}
.buy{color:#37d67a}.sell{color:#ff5c67}.warn{color:#ffb84d}.muted{color:#8d9ab5}
.history{max-height:245px;overflow:auto;font-size:12px}.row{padding:7px 0;border-bottom:1px solid #202a42}
footer{padding:8px 14px;color:#7f8ca8;font-size:11px}
@media(max-width:850px){.wrap{grid-template-columns:1fr}#chart{height:500px}}
</style>
</head>
<body>
<header>
<h1>Crypto Edge Terminal V1</h1>
<div class="controls">
<select id="symbol"><option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option><option>XRPUSDT</option><option>BNBUSDT</option></select>
<select id="tf"><option value="5m">5 Minute</option></select>
<button id="reload">Reload</button>
</div>
</header>

<div class="wrap">
<div class="panel"><div id="chart"></div></div>
<div class="panel side">
<div class="title">V21 Tracker</div>
<div class="grid">
<div class="card"><div class="lab">TREND</div><div id="trend" class="val">WAIT</div></div>
<div class="card"><div class="lab">SIGNAL</div><div id="signal" class="val">WAIT</div></div>
<div class="card"><div class="lab">LIVE RSI</div><div id="liveRsi" class="val">-</div></div>
<div class="card"><div class="lab">CLOSED RSI</div><div id="closedRsi" class="val">-</div></div>
<div class="card"><div class="lab">ENTRY</div><div id="entry" class="val">-</div></div>
<div class="card"><div class="lab">CURRENT SL</div><div id="sl" class="val">-</div></div>
<div class="card"><div class="lab">TP1</div><div id="tp1" class="val">-</div></div>
<div class="card"><div class="lab">TP2</div><div id="tp2" class="val">-</div></div>
<div class="card"><div class="lab">TP STATUS</div><div id="tpStatus" class="val">-</div></div>
<div class="card"><div class="lab">WARNING</div><div id="warning" class="val">-</div></div>
<div class="card"><div class="lab">LAST RESULT</div><div id="result" class="val">-</div></div>
<div class="card"><div class="lab">LOCK</div><div id="lock" class="val">-</div></div>
</div>
<div style="margin-top:14px" class="title">Signal History</div>
<div id="history" class="history"></div>
</div>
</div>
<footer>V21.0 paper/signal tracker. Signals are calculated only from closed 5m candles. Internet connection required.</footer>

<script>
const CFG={
 emaFast:20,emaSlow:50,rsiLen:14,atrLen:14,slATR:1.5,tp1RR:1.5,tp2RR:3,
 pivotLen:5,minBody:.01,buyRSI:55,sellRSI:45,breakoutATR:.15,retestATR:.20,
 maxWaitBars:6,earlySignals:true,useSlope:false,useVolume:false,
 allowAlreadyAbove:true,allowAlreadyBelow:true,moveBE:true,useTrailing:true,
 trailATR:1,oneSignal:true,warningMove:2
};
let symbol="BTCUSDT",ws=null,chart=null;
let candles=[],state={dir:0,entry:null,originalSL:null,sl:null,tp1:null,tp2:null,tp1Hit:false,be:false,entryIndex:-1,
buyLock:false,sellLock:false,waitBuy:false,waitSell:false,buyWait:0,sellWait:0,lastResult:"WAIT",warning:"-",
sellWarn:false,buyWarn:false,history:[],res:null,sup:null};

const $=id=>document.getElementById(id);
function fmt(x){return x==null||!isFinite(x)?"-":Number(x).toLocaleString(undefined,{maximumFractionDigits:8})}
function ema(a,n){let out=[],k=2/(n+1),e=null;for(let i=0;i<a.length;i++){e=e==null?a[i]:a[i]*k+e*(1-k);out.push(e)}return out}
function sma(a,n,i){if(i+1<n)return null;let s=0;for(let j=i-n+1;j<=i;j++)s+=a[j];return s/n}
function rsi(a,n){let o=Array(a.length).fill(null),g=0,l=0;if(a.length<=n)return o;for(let i=1;i<=n;i++){let d=a[i]-a[i-1];if(d>=0)g+=d;else l-=d}g/=n;l/=n;o[n]=l===0?100:100-100/(1+g/l);for(let i=n+1;i<a.length;i++){let d=a[i]-a[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;o[i]=l===0?100:100-100/(1+g/l)}return o}
function atr(cs,n){let tr=Array(cs.length).fill(null),o=Array(cs.length).fill(null);for(let i=0;i<cs.length;i++){tr[i]=i?Math.max(cs[i].h-cs[i].l,Math.abs(cs[i].h-cs[i-1].c),Math.abs(cs[i].l-cs[i-1].c)):cs[i].h-cs[i].l;if(i>=n-1){let s=0;for(let j=i-n+1;j<=i;j++)s+=tr[j];o[i]=s/n}}return o}
function pivots(i){let p=CFG.pivotLen;if(i<2*p)return;let hi=candles[i-p].h,lo=candles[i-p].l,ph=true,pl=true;for(let j=i-2*p;j<=i;j++){if(j!==i-p&&candles[j].h>=hi)ph=false;if(j!==i-p&&candles[j].l<=lo)pl=false}if(ph)state.res=hi;if(pl)state.sup=lo}

function addHistory(type,price,text){state.history.unshift({t:new Date().toLocaleTimeString(),type,price,text});state.history=state.history.slice(0,30);$("history").innerHTML=state.history.map(x=>`<div class="row"><span class="${x.type==='BUY'?'buy':x.type==='SELL'?'sell':'warn'}"><b>${x.type}</b></span> ${x.t} — ${x.text} ${x.price?fmt(x.price):""}</div>`).join("")}

function process(i){
 const c=candles[i], prev=candles[i-1]; if(!prev)return;
 const closes=candles.map(x=>x.c), highs=candles.map(x=>x.h), lows=candles.map(x=>x.l), vols=candles.map(x=>x.v||0);
 const e20=ema(closes,CFG.emaFast),e50=ema(closes,CFG.emaSlow),rs=rsi(closes,CFG.rsiLen),at=atr(candles,CFG.atrLen);
 pivots(i);
 const R=state.res,S=state.sup,A=at[i], r=rs[i], rp=rs[i-1], e20p=e20[i-1];
 if(!A||r==null||rp==null)return;
 const bullTrend=c.c>e20[i]&&e20[i]>e50[i], bearTrend=c.c<e20[i]&&e20[i]<e50[i];
 const slopeBuy=!CFG.useSlope||e20[i]>e20p, slopeSell=!CFG.useSlope||e20[i]<e20p;
 const body=Math.abs(c.c-c.o), bull=c.c>c.o&&body>=CFG.minBody, bear=c.c<c.o&&body>=CFG.minBody;
 const rBuy=r>rp, rSell=r<rp, pBuy=c.c>prev.c,pSell=c.c<prev.c;
 const freshBuy=rBuy||pBuy,freshSell=rSell||pSell;
 const volAvg=sma(vols,20,i), volOK=!CFG.useVolume||(volAvg!=null&&c.v>volAvg);
 const buyBreak=R!=null&&c.c>R+A*CFG.breakoutATR&&prev.c<=R;
 const sellBreak=S!=null&&c.c<S-A*CFG.breakoutATR&&prev.c>=S;
 const buyAbove=R!=null&&c.c>R+A*CFG.breakoutATR;
 const sellBelow=S!=null&&c.c<S-A*CFG.breakoutATR;
 const buyRet=R!=null&&c.l<=R+A*CFG.retestATR&&c.c>R&&bull;
 const sellRet=S!=null&&c.h>=S-A*CFG.retestATR&&c.c<S&&bear;

 if(R!=null&&c.c<=R)state.buyLock=false;
 if(S!=null&&c.c>=S)state.sellLock=false;

 if(buyBreak){state.waitBuy=true;state.buyWait=0}
 if(sellBreak){state.waitSell=true;state.sellWait=0}
 if(state.waitBuy){state.buyWait++;if(state.buyWait>CFG.maxWaitBars)state.waitBuy=false}
 if(state.waitSell){state.sellWait++;if(state.sellWait>CFG.maxWaitBars)state.waitSell=false}

 const earlyBuy=CFG.earlySignals&&bullTrend&&r>=CFG.buyRSI&&bull&&freshBuy&&slopeBuy&&volOK;
 const earlySell=CFG.earlySignals&&bearTrend&&r<=CFG.sellRSI&&bear&&freshSell&&slopeSell&&volOK;
 const directBuy=buyBreak||(CFG.allowAlreadyAbove&&buyAbove&&freshBuy);
 const directSell=sellBreak||(CFG.allowAlreadyBelow&&sellBelow&&freshSell);
 const buySignal=!state.dir&&!state.buyLock&&slopeBuy&&volOK&&((CFG.earlySignals&&earlyBuy)||(directBuy)||(state.waitBuy&&buyRet));
 const sellSignal=!state.dir&&!state.sellLock&&slopeSell&&volOK&&((CFG.earlySignals&&earlySell)||(directSell)||(state.waitSell&&sellRet));

 if(buySignal){
   state.dir=1;state.entry=c.c;state.originalSL=c.c-A*CFG.slATR;state.sl=state.originalSL;
   let risk=state.entry-state.originalSL;state.tp1=state.entry+risk*CFG.tp1RR;state.tp2=state.entry+risk*CFG.tp2RR;
   state.tp1Hit=false;state.be=false;state.entryIndex=i;state.lastResult="BUY ACTIVE";state.warning="-";state.buyWarn=false;
   state.buyLock=CFG.oneSignal;state.waitBuy=false;addHistory("BUY",c.c,`Entry ${fmt(c.c)} | SL ${fmt(state.sl)} | TP1 ${fmt(state.tp1)} | TP2 ${fmt(state.tp2)}`);
 }
 if(sellSignal){
   state.dir=-1;state.entry=c.c;state.originalSL=c.c+A*CFG.slATR;state.sl=state.originalSL;
   let risk=state.originalSL-state.entry;state.tp1=state.entry-risk*CFG.tp1RR;state.tp2=state.entry-risk*CFG.tp2RR;
   state.tp1Hit=false;state.be=false;state.entryIndex=i;state.lastResult="SELL ACTIVE";state.warning="-";state.sellWarn=false;
   state.sellLock=CFG.oneSignal;state.waitSell=false;addHistory("SELL",c.c,`Entry ${fmt(c.c)} | SL ${fmt(state.sl)} | TP1 ${fmt(state.tp1)} | TP2 ${fmt(state.tp2)}`);
 }

 if(state.dir&&i>state.entryIndex){
   if(state.dir===1){
     const stopped=c.l<=state.sl,tp2=c.h>=state.tp2;
     if(stopped){state.lastResult=state.be?"BREAK-EVEN HIT":"STOP LOSS HIT";addHistory("WARN",state.sl,state.lastResult);state.dir=0}
     else if(tp2){state.lastResult="TP2 HIT";addHistory("WARN",state.tp2,"TP2 HIT");state.dir=0}
     else{
       if(!state.tp1Hit&&c.h>=state.tp1){state.tp1Hit=true;addHistory("WARN",state.tp1,"TP1 HIT");if(CFG.moveBE){state.sl=state.entry;state.be=true;addHistory("WARN",state.sl,"BREAK-EVEN ACTIVATED")}}
       if(CFG.useTrailing){let tsl=c.c-A*CFG.trailATR;if(tsl>state.sl)state.sl=tsl}
     }
   }else{
     const stopped=c.h>=state.sl,tp2=c.l<=state.tp2;
     if(stopped){state.lastResult=state.be?"BREAK-EVEN HIT":"STOP LOSS HIT";addHistory("WARN",state.sl,state.lastResult);state.dir=0}
     else if(tp2){state.lastResult="TP2 HIT";addHistory("WARN",state.tp2,"TP2 HIT");state.dir=0}
     else{
       if(!state.tp1Hit&&c.l<=state.tp1){state.tp1Hit=true;addHistory("WARN",state.tp1,"TP1 HIT");if(CFG.moveBE){state.sl=state.entry;state.be=true;addHistory("WARN",state.sl,"BREAK-EVEN ACTIVATED")}}
       if(CFG.useTrailing){let tsl=c.c+A*CFG.trailATR;if(tsl<state.sl)state.sl=tsl}
     }
   }
 }
 if(state.dir===-1&&!state.sellWarn){
   if(c.c>e20[i]||r>rp+CFG.warningMove){state.warning=c.c>e20[i]?"EMA RECLAIM / RSI RISING":"RSI RISING";state.sellWarn=true;addHistory("WARN",c.c,state.warning)}
 }
 if(state.dir===1&&!state.buyWarn){
   if(c.c<e20[i]||r<rp-CFG.warningMove){state.warning=c.c<e20[i]?"EMA LOST / RSI FALLING":"RSI FALLING";state.buyWarn=true;addHistory("WARN",c.c,state.warning)}
 }
}

function render(){
 if(!chart)chart=echarts.init($("chart"));
 const times=candles.map(x=>new Date(x.t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}));
 const price=candles.map(x=>[x.o,x.c,x.l,x.h]);
 const closes=candles.map(x=>x.c),e20=ema(closes,20),e50=ema(closes,50);
 const ema20=e20.map((v,i)=>[times[i],v]),ema50=e50.map((v,i)=>[times[i],v]);
 let buy=[],sell=[];
 state.history.forEach(()=>{});
 // mark current active entry on the chart
 if(state.entry!=null){let idx=state.entryIndex;if(idx>=0&&idx<candles.length)(state.dir===1?buy:sell).push([times[idx],state.entry])}
 const lines=[];
 if(state.res!=null)lines.push({yAxis:state.res,name:"Resistance"});
 if(state.sup!=null)lines.push({yAxis:state.sup,name:"Support"});
 if(state.entry!=null)lines.push({yAxis:state.entry,name:"Entry"});
 if(state.sl!=null)lines.push({yAxis:state.sl,name:"SL"});
 if(state.tp1!=null)lines.push({yAxis:state.tp1,name:"TP1"});
 if(state.tp2!=null)lines.push({yAxis:state.tp2,name:"TP2"});
 chart.setOption({backgroundColor:"#10172a",animation:false,tooltip:{trigger:"axis"},grid:{left:55,right:18,top:15,bottom:35},
 xAxis:{type:"category",data:times,axisLabel:{color:"#8d9ab5"}},yAxis:{scale:true,axisLabel:{color:"#8d9ab5"},splitLine:{lineStyle:{color:"#202a42"}}},
 series:[
 {type:"candlestick",data:price,itemStyle:{},markPoint:{data:[...buy.map(x=>({coord:x,name:"BUY",value:"BUY"})),...sell.map(x=>({coord:x,name:"SELL",value:"SELL"}))]}},
 {type:"line",data:ema20.map(x=>x[1]),showSymbol:false,lineStyle:{width:1.3}},
 {type:"line",data:ema50.map(x=>x[1]),showSymbol:false,lineStyle:{width:1.3}}
 ],graphic:[]});
}
function updateUI(){
 let trend="WAIT";if(candles.length>=50){let cs=candles.map(x=>x.c),a=ema(cs,20),b=ema(cs,50),c=candles.at(-1).c;trend=c>a.at(-1)&&a.at(-1)>b.at(-1)?"BULLISH":c<a.at(-1)&&a.at(-1)<b.at(-1)?"BEARISH":"SIDEWAYS"}
 $("trend").textContent=trend;$("trend").className="val "+(trend==="BULLISH"?"buy":trend==="BEARISH"?"sell":"");
 $("signal").textContent=state.dir===1?"BUY ACTIVE":state.dir===-1?"SELL ACTIVE":"WAIT";
 $("signal").className="val "+(state.dir===1?"buy":state.dir===-1?"sell":"");
 let rs=rsi(candles.map(x=>x.c),14), live=rs.at(-1), closed=rs.at(-2);
 $("liveRsi").textContent=fmt(live);$("closedRsi").textContent=fmt(closed);
 $("entry").textContent=fmt(state.entry);$("sl").textContent=fmt(state.sl);$("tp1").textContent=fmt(state.tp1);$("tp2").textContent=fmt(state.tp2);
 $("tpStatus").textContent=state.tp1Hit?"TP1 HIT / "+(state.be?"BE ACTIVE":"ACTIVE"):"WAIT TP1";
 $("warning").textContent=state.warning||"-";$("result").textContent=state.lastResult||"-";
 $("lock").textContent=state.buyLock?"BUY LOCK":state.sellLock?"SELL LOCK":"UNLOCKED";
}
async function load(){
 symbol=$("symbol").value;
 if(ws){try{ws.close()}catch(e){}}
 state={dir:0,entry:null,originalSL:null,sl:null,tp1:null,tp2:null,tp1Hit:false,be:false,entryIndex:-1,buyLock:false,sellLock:false,waitBuy:false,waitSell:false,buyWait:0,sellWait:0,lastResult:"WAIT",warning:"-",sellWarn:false,buyWarn:false,history:[],res:null,sup:null};
 const url=`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=5m&limit=500`;
 try{
   const raw=await fetch(url).then(r=>r.json());
   candles=raw.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}));
   for(let i=1;i<candles.length;i++)process(i);
   render();updateUI();
   ws=new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_5m`);
   ws.onmessage=e=>{let d=JSON.parse(e.data),k=d.k,c={t:k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c,v:+k.v};
     if(!candles.length)return;
     if(candles.at(-1).t===c.t)candles[candles.length-1]=c;else if(c.t>candles.at(-1).t){candles.push(c);if(candles.length>550)candles.shift()}
     if(k.x){process(candles.length-1)}
     render();updateUI();
   };
 }catch(e){$("result").textContent="DATA ERROR";$("history").innerHTML='<div class="row sell">Unable to load market data. Check internet connection.</div>'}
}
$("symbol").onchange=load;$("reload").onclick=load;window.addEventListener("resize",()=>chart&&chart.resize());load();
</script>
</body>
</html>
